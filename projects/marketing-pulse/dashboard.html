<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Pulse · GA 대시보드</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/dashboard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="mp-nav">
  <div class="mp-nav-inner">
    <a class="mp-brand" href="../../index.html">
      <div class="mp-logo">M</div>
      <div>
        <div style="font-weight:700">Marketing Pulse</div>
        <div style="font-size:0.65rem;color:var(--color-text-muted)">GA 통합 대시보드</div>
      </div>
    </a>
    <div class="mp-actions">
      <select id="period-select" class="mp-btn-outline mp-btn">
        <option value="7">최근 7일</option>
        <option value="28">최근 28일</option>
        <option value="q">이번 분기</option>
      </select>
      <span style="color:var(--color-text-muted)">📅 2026-05-05 ~ 2026-05-11</span>
      <a href="./insights.html" class="mp-btn mp-btn-primary">🧠 AI 인사이트 →</a>
    </div>
  </div>
</nav>

<main class="mp-shell">
  <section id="kpi-row" class="kpi-row"><div style="color:#94a3b8;padding:1rem">로딩 중…</div></section>

  <section class="chart-row">
    <div class="chart-card">
      <h3>7일 추세 — 세션 & 전환</h3>
      <div class="sub">전체 트래픽과 전환 흐름</div>
      <canvas id="trendChart" height="100"></canvas>
    </div>
    <div class="chart-card">
      <h3>채널별 유입</h3>
      <div class="sub">최근 7일 기준</div>
      <canvas id="channelChart" height="160"></canvas>
    </div>
  </section>

  <section class="bottom-row">
    <div class="pages-table">
      <div class="head">📄 인기 페이지 TOP 5 <span style="font-size:0.7rem;font-weight:500;color:var(--color-text-muted);margin-left:0.5rem">컬럼명을 클릭하면 정렬됩니다</span></div>
      <table id="pages-table">
        <thead><tr>
          <th data-sort="path" data-dir="asc">페이지</th>
          <th data-sort="views" data-dir="desc">조회수 ↕</th>
          <th data-sort="avgTime" data-dir="desc">평균 체류 ↕</th>
          <th data-sort="bounce" data-dir="desc">이탈률 ↕</th>
        </tr></thead>
        <tbody id="pages-tbody"></tbody>
      </table>
    </div>
    <div class="chart-card">
      <h3>📱 디바이스</h3>
      <div style="position:relative;height:180px"><canvas id="deviceChart"></canvas></div>
    </div>
  </section>
</main>

<script type="module" src="./js/dashboard-page.js"></script>
<script>
  // 디바이스 차트는 빠르게 인라인으로 (구조가 단순)
  window.addEventListener("load", () => {
    new Chart(document.getElementById('deviceChart'), {
      type: 'bar',
      data: {
        labels: ["📱 모바일", "💻 데스크톱", "📋 태블릿"],
        datasets: [{
          data: [68.2, 26.4, 5.4],
          backgroundColor: ['#14b8a6', '#6366f1', '#ec4899'],
          borderRadius: 6,
          borderSkipped: false,
          barThickness: 22
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `  ${ctx.parsed.x}%` } }
        },
        scales: {
          x: { beginAtZero: true, max: 100, grid: { color: '#f1f5f9' }, ticks: { callback: v => `${v}%`, font: { size: 10 } } },
          y: { grid: { display: false }, ticks: { font: { size: 12 } } }
        }
      }
    });
  });
</script>
</body>
</html>
