<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Dashboard · 매출 대시보드</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/dashboard.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="mp-nav">
  <div class="mp-nav-inner">
    <a class="mp-brand" href="../../index.html">
      <div class="mp-logo">S</div>
      <div>
        <div style="font-weight:700">Sales Dashboard</div>
        <div style="font-size:0.65rem;color:var(--color-text-muted)">엑셀 업로드 → 매출 시각화</div>
      </div>
    </a>
    <div class="mp-actions">
      <span id="file-status" style="color:var(--color-text-muted)">📂 파일 미선택</span>
      <a href="./insights.html" class="mp-btn mp-btn-primary">🧠 AI 매출 예측 →</a>
    </div>
  </div>
</nav>

<main class="mp-shell">
  <section id="upload-zone" class="upload-zone">
    <div class="upload-inner">
      <div class="upload-icon">📊</div>
      <h2>매출 엑셀 파일을 업로드하세요</h2>
      <p>최근 12개월 매출 시트를 끌어다 놓거나 클릭해 선택하면, 자동으로 대시보드가 만들어집니다.</p>
      <label class="upload-cta" for="file-input">
        <span>＋ 엑셀 파일 선택</span>
        <input id="file-input" type="file" accept=".xlsx,.xls,.csv" hidden />
      </label>
      <div class="upload-hint">.xlsx · .xls · .csv 지원 · 데모는 샘플 매출 데이터로 자동 렌더링됩니다</div>
      <button id="use-sample" class="upload-sample">샘플 데이터로 바로 보기</button>
    </div>
  </section>

  <section id="dashboard" class="dashboard hidden">
    <section id="kpi-row" class="kpi-row"></section>

    <section class="chart-row">
      <div class="chart-card">
        <h3>📈 월별 매출 추세</h3>
        <div class="sub">최근 12개월 — 매출 / 거래 건수</div>
        <canvas id="trendChart" height="100"></canvas>
      </div>
      <div class="chart-card">
        <h3>🧺 카테고리별 매출</h3>
        <div class="sub">이번 달 기준 비중</div>
        <canvas id="categoryChart" height="160"></canvas>
      </div>
    </section>

    <section class="bottom-row">
      <div class="pages-table">
        <div class="head">🏆 TOP 5 제품 <span style="font-size:0.7rem;font-weight:500;color:var(--color-text-muted);margin-left:0.5rem">컬럼명을 클릭하면 정렬됩니다</span></div>
        <table id="products-table">
          <thead><tr>
            <th data-sort="name" data-dir="asc">제품명</th>
            <th data-sort="revenue" data-dir="desc">매출 ↕</th>
            <th data-sort="units" data-dir="desc">판매 수 ↕</th>
            <th data-sort="growth" data-dir="desc">전월비 ↕</th>
          </tr></thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
      <div class="chart-card">
        <h3>📡 채널별 매출</h3>
        <div style="position:relative;height:180px"><canvas id="channelChart"></canvas></div>
      </div>
    </section>
  </section>
</main>

<div id="mp-flash"></div>

<script type="module" src="./js/dashboard-page.js"></script>
</body>
</html>
