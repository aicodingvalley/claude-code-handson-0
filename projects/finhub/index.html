<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinHub Weekly · 경제 지표 대시보드</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/report.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<nav class="fh-nav">
  <div class="fh-nav-inner">
    <a class="fh-brand" href="../../index.html">
      <div class="fh-logo">F</div>
      <div>
        <div style="font-weight:700">FinHub Weekly</div>
        <div style="font-size:0.65rem;color:var(--color-text-muted)">경제 지표 대시보드</div>
      </div>
    </a>
    <div class="fh-actions">
      <span style="font-size:0.75rem;color:var(--color-text-muted)" id="updated-at">실시간 업데이트</span>
      <a href="./report.html" class="fh-btn fh-btn-primary" style="text-decoration:none">📄 최신 리포트</a>
    </div>
  </div>
</nav>

<main style="max-width:1180px;margin:1.5rem auto;padding:0 1.5rem;display:flex;flex-direction:column;gap:1.25rem">

  <section>
    <h2 style="font-size:1rem;margin:0 0 0.75rem;color:#334155">💹 주요 지표</h2>
    <div id="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:1rem">
    <div class="card">
      <h3>📊 전일 대비 변화율</h3>
      <div style="position:relative;height:340px"><canvas id="indicator-chart"></canvas></div>
    </div>
    <div class="card">
      <h3>🔼🔽 시장 폭 (Advance / Decline)</h3>
      <div id="breadth-summary" style="display:flex;justify-content:space-between;font-size:0.8rem;margin:0.5rem 0 0.75rem;color:#475569"></div>
      <div style="position:relative;height:60px"><canvas id="ratio-chart"></canvas></div>
      <div id="breadth-detail" style="margin-top:1rem;display:flex;flex-direction:column;gap:0.4rem"></div>
    </div>
  </section>

</main>

<script type="module" src="./js/dashboard-page.js"></script>
</body>
</html>
