<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeamChat · AI 회의록 자동 정리</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/chat.css" />
<link rel="stylesheet" href="./css/notes.css" />
</head>
<body>

<div class="tc-shell is-narrow">
  <aside class="tc-sidebar">
    <div class="head">
      <div class="logo">T</div>
      <div style="color:white;font-weight:700">TeamChat</div>
    </div>
    <div class="section">
      <h4>채널</h4>
      <ul>
        <li><a href="./index.html" style="color:inherit;text-decoration:none"># 일반</a></li>
        <li class="active"># 마케팅 <span style="font-size:0.625rem;background:#fbbf24;color:#7c2d12;padding:1px 6px;border-radius:9999px;margin-left:0.4rem;font-weight:700">AI</span></li>
        <li># 개발</li>
        <li># 디자인</li>
        <li># 고객운영</li>
      </ul>
    </div>
  </aside>

  <main class="tc-main">
    <header class="tc-header">
      <div>
        <h2># 마케팅</h2>
        <div class="sub">캠페인 회의 진행 중 · 6명 참여</div>
      </div>
      <button style="background:linear-gradient(90deg,#7c3aed,#4f46e5);color:white;border:none;padding:0.4rem 0.875rem;border-radius:0.4rem;font-weight:700;cursor:pointer;font-size:0.75rem">✨ AI 회의록 다시 정리</button>
    </header>
    <div class="tc-messages scrollbar-thin" id="messages">로딩 중…</div>
  </main>

  <aside class="notes-panel">
    <div class="head">
      <span class="badge"><span class="icon">✨</span> AI 회의록</span>
      <h3 id="notes-title">제목 로딩 중…</h3>
      <div class="meta" id="notes-meta"></div>
    </div>
    <div class="notes-body scrollbar-thin" id="notes">로딩 중…</div>
    <div class="notes-actions">
      <button class="primary">📤 채널에 공유</button>
      <button class="secondary">📄 마크다운 저장</button>
    </div>
  </aside>
</div>

<div style="position:fixed;top:0.5rem;left:0.5rem">
  <a href="../../index.html" style="font-size:0.7rem;color:#cbd5e1;background:rgba(255,255,255,0.1);padding:0.25rem 0.5rem;border-radius:0.25rem">← 허브</a>
</div>

<script type="module" src="./js/notes-page.js"></script>
</body>
</html>
