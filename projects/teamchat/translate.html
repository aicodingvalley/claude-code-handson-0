<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeamChat · 실시간 다국어 번역</title>
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/chat.css" />
<link rel="stylesheet" href="./css/notes.css" />
</head>
<body>

<div class="tc-shell is-narrow">
  <aside class="tc-sidebar">
    <div class="head">
      <div class="logo">T</div>
      <div style="color:white;font-weight:700">TeamChat</div>
    </div>
    <div class="section">
      <h4>채널</h4>
      <ul>
        <li><a href="./index.html" style="color:inherit;text-decoration:none"># 일반</a></li>
        <li><a href="./meeting-notes.html" style="color:inherit;text-decoration:none"># 마케팅</a></li>
        <li class="active"># 글로벌-개발 🌐</li>
        <li># 디자인</li>
      </ul>
      <div class="tc-helper" style="margin-top:1rem">🌐 <strong>번역 ON</strong><br>외국어 메시지가 자동으로 한국어로 번역돼서 표시돼요.</div>
    </div>
  </aside>

  <main class="tc-main">
    <header class="tc-header">
      <div>
        <h2 style="display:flex;align-items:center;gap:0.4rem"># 글로벌-개발 <span style="font-size:0.625rem;background:#d1fae5;color:#065f46;padding:1px 6px;border-radius:9999px;font-weight:700">🌐 자동 번역</span></h2>
        <div class="sub">한·미·일 개발팀 협업 채널 · 9명 참여</div>
      </div>
      <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.7rem;color:var(--color-text-muted)">
        내 언어:
        <select style="border:1px solid #cbd5e1;border-radius:0.25rem;padding:0.2rem 0.4rem">
          <option>🇰🇷 한국어</option><option>🇺🇸 English</option><option>🇯🇵 日本語</option>
        </select>
      </div>
    </header>
    <div class="tc-messages scrollbar-thin" id="messages">로딩 중…</div>
    <div class="tc-input">
      <div class="box">
        <span style="font-size:0.625rem;background:#d1fae5;color:#065f46;padding:1px 6px;border-radius:9999px;font-weight:700">🌐 자동 번역 ON</span>
        <input placeholder="한국어로 입력하면 다른 멤버 언어로 자동 번역돼서 전송돼요" />
        <button>전송</button>
      </div>
    </div>
  </main>

  <aside class="tc-rightbar scrollbar-thin">
    <h4>멤버 (9)</h4>
    <ul id="members"></ul>
    <div class="tc-helper" style="margin-top:1rem;background:#dbeafe;color:#1e40af;border-color:#bfdbfe">
      💡 메시지를 보내면 받는 사람 언어로 <strong>자동 번역</strong>되어 도착해요.<br>OpenAI 호출 1회 ≈ $0.0002.
    </div>
  </aside>
</div>

<div style="position:fixed;top:0.5rem;left:0.5rem">
  <a href="../../index.html" style="font-size:0.7rem;color:#cbd5e1;background:rgba(255,255,255,0.1);padding:0.25rem 0.5rem;border-radius:0.25rem">← 허브</a>
</div>

<script type="module" src="./js/translate-page.js"></script>
</body>
</html>
